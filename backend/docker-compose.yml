version: "3.9"

services:

  backend:
    build: .
    container_name: memo-backend

    ports:
      - "8000:8000"

    volumes:
      - .:/app

    env_file:
      - .env.prod

    depends_on:
      - postgres

  postgres:
    image: postgres:16

    container_name: memo-postgres

    restart: always

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notes_app

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: memo-redis
    ports:
      - "6379:6379"

volumes:
  postgres_data: